name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read # nx-set-shas looks up the last successful run on main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  main:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bookit
          POSTGRES_PASSWORD: bookit
          POSTGRES_DB: bookit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookit -d bookit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Same values as .env.example. Only Postgres runs here; MinIO and Mailpit do not.
    env:
      DATABASE_URL: postgresql://bookit:bookit@localhost:5432/bookit
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: bookit
      S3_SECRET_KEY: bookit-secret
      S3_BUCKET: bookit
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      MAIL_FROM: Bookit <no-reply@bookit.local>
      SESSION_SECRET: change-me-to-a-random-string-of-32-chars
      APP_URL: http://localhost:4200
      ADMIN_EMAIL: admin@bookit.local
      ADMIN_PASSWORD: admin1234

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: nrwl/nx-set-shas@v5

      - run: npx nx affected -t lint test build
